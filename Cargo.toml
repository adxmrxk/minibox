[package]
name = "minibox"
version = "0.2.0"
edition = "2021"
description = "Run a command in its own Linux namespaces with cgroup v2 limits, rootfs, networking and seccomp"

[dependencies]
nix = { version = "0.29", features = ["sched", "mount", "process", "fs", "signal"] }
libc = "0.2"
seccompiler = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = 3
